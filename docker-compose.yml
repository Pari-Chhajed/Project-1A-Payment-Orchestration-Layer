services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://payflow:payflow@postgres:5432/payflow
      API_KEY: test-api-key-12345
      RAZORPAY_WEBHOOK_SECRET: razorpay_webhook_secret_test
      STRIPE_WEBHOOK_SECRET: stripe_webhook_secret_test
      PAYU_WEBHOOK_SECRET: payu_webhook_secret_test
      UPI_WEBHOOK_SECRET: upi_webhook_secret_test
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data: