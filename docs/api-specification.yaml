openapi: 3.0.0

info:
title: PayFlow Commerce API
version: 1.0.0
description: Payment Orchestration Layer API

servers:

* url: http://localhost:8000

paths:
/api/v1/payments:
post:
summary: Create payment
security:
- ApiKeyAuth: []
requestBody:
required: true
responses:
"201":
description: Payment created

/api/v1/payments/{payment_id}:
get:
summary: Get payment by ID
security:
- ApiKeyAuth: []
parameters:
- name: payment_id
in: path
required: true
schema:
type: string
responses:
"200":
description: Payment details

/api/v1/routing/config:
get:
summary: Get routing configuration
responses:
"200":
description: Routing config

```
put:
  summary: Update routing configuration
  responses:
    "200":
      description: Config updated
```

/api/v1/webhooks/razorpay:
post:
summary: Razorpay webhook
responses:
"200":
description: Webhook processed

/api/v1/webhooks/stripe:
post:
summary: Stripe webhook
responses:
"200":
description: Webhook processed

/api/v1/reconciliation/run:
post:
summary: Trigger reconciliation
responses:
"200":
description: Reconciliation completed

components:
securitySchemes:
ApiKeyAuth:
type: apiKey
in: header
name: X-API-Key
